<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="description" content="杨钧的未来两周忙闲时间，北京时间每日 08:00—22:00。" />
    <title>Availability · 杨钧 / Jun Yang</title>
  </head>
  <body>
    <main>
      <header class="identity">
        <div><p class="eyebrow">杨钧 / JUN YANG</p><h1>Availability<span>.</span></h1></div>
      </header>
      <div class="header-rule"></div>
      <section class="toolbar" aria-label="日历信息">
        <div><h2 id="range-title"></h2></div>
        <div class="refresh-group"><span id="updated">尚未获取数据</span><button id="refresh" type="button">刷新 ↻</button></div>
      </section>
      <div class="legend" aria-label="图例"><span><i class="free"></i>空闲</span><span><i class="busy-key"></i>忙碌</span><span><i class="past-key"></i>已过去</span><span><i class="unknown-key"></i>无数据</span><small>08:00—22:00 · 每格 30 分钟</small></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="calendar" class="weeks" aria-busy="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
