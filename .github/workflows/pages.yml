name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check API configuration
        env:
          VITE_AVAILABILITY_API_URL: ${{ vars.VITE_AVAILABILITY_API_URL }}
        run: |
          node --input-type=module -e 'const value = process.env.VITE_AVAILABILITY_API_URL; if (!value) throw new Error("Set repository variable VITE_AVAILABILITY_API_URL before deployment"); const url = new URL(value); if (url.protocol !== "https:") throw new Error("Availability API must use HTTPS");'
      - run: npm run build
        env:
          VITE_AVAILABILITY_API_URL: ${{ vars.VITE_AVAILABILITY_API_URL }}
      - run: mkdir -p site/availability && cp -R dist/. site/availability/ && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
